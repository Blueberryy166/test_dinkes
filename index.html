<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Layanan & Informasi - Dinas Kesehatan</title>
  <!-- Tailwind CSS via CDN untuk styling modern & responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 flex flex-col items-center justify-between text-slate-800">

  <!-- Kontainer Utama (Ukuran ideal untuk layar HP saat scan QR) -->
  <div class="w-full max-w-md mx-auto">
    
    <!-- Header Instansi Dinkes -->
    <header class="text-center mb-8">
      <!-- Logo Ikon Kesehatan -->
      <div class="w-20 h-20 bg-emerald-600 text-white rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-emerald-200 mb-4 ring-4 ring-emerald-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </div>

      <span class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold uppercase tracking-wider mb-2">
        Portal Informasi & Tamu
      </span>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Dinas Kesehatan</h1>
      <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">
        Silakan pilih layanan di bawah untuk registrasi tamu, kearsipan regulasi, atau pengisian survei.
      </p>
    </header>

    <!-- Tempat Daftar Tautan dari Database Firebase -->
    <main id="link-list" class="space-y-3.5">
      <!-- Placeholder loading -->
      <div class="p-6 bg-white rounded-2xl border border-slate-200 shadow-sm text-center">
        <div class="animate-spin inline-block w-6 h-6 border-2 border-emerald-600 border-t-transparent rounded-full mb-2"></div>
        <p class="text-xs text-slate-500 font-medium">Memuat daftar tautan layanan...</p>
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer class="mt-12 text-center text-xs text-slate-400">
    <p>© 2026 Dinas Kesehatan</p>
    <p class="text-[10px] mt-0.5">Sistem Informasi Akses Mandiri Tamu & Regulasi</p>
  </footer>

  <!-- Firebase Integration via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAf4oRUliv3bcDkD2t4REgojJ48dIz_1ts",
      authDomain: "test-dinkes.firebaseapp.com",
      projectId: "test-dinkes",
      storageBucket: "test-dinkes.firebasestorage.app",
      messagingSenderId: "340667856156",
      appId: "1:340667856156:web:e7edcbf1e4e85d2a0876d9",
      measurementId: "G-0GG7NLYBN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function muatTautanLayanan() {
      const container = document.getElementById("link-list");

      try {
        const q = query(collection(db, "links"), orderBy("urutan", "asc"));
        const querySnapshot = await getDocs(q);

        container.innerHTML = "";

        if (querySnapshot.empty) {
          container.innerHTML = `
            <div class="p-8 bg-white rounded-2xl border border-dashed border-slate-300 text-center text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <p class="text-sm font-medium">Belum ada layanan yang ditambahkan.</p>
              <p class="text-xs mt-1 text-slate-400">Silakan tambahkan link melalui panel admin.</p>
            </div>
          `;
          return;
        }

        querySnapshot.forEach((docSnapshot) => {
          const item = docSnapshot.data();

          const card = document.createElement("a");
          card.href = item.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.className = "group flex items-center justify-between p-4 bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-500 hover:bg-emerald-50/30 transition-all duration-200 active:scale-[0.98]";

          card.innerHTML = `
            <div class="flex items-center space-x-3.5 pr-3">
              <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-200 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
              </div>
              <div>
                <span class="inline-block text-[11px] font-bold text-emerald-700 tracking-wide uppercase">
                  ${item.kategori || 'Informasi'}
                </span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-emerald-950 transition-colors">
                  ${item.judul}
                </h2>
              </div>
            </div>
            <div class="text-slate-300 group-hover:text-emerald-600 group-hover:translate-x-0.5 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error Firebase:", error);
        container.innerHTML = `
          <div class="p-6 bg-rose-50 border border-rose-200 rounded-2xl text-center text-rose-700">
            <p class="text-xs font-bold uppercase tracking-wider mb-1">Gagal Menghubungkan</p>
            <p class="text-xs">${error.message}</p>
          </div>
        `;
      }
    }

    muatTautanLayanan();
  </script>
</body>
</html>
