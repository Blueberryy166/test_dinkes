<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Layanan & Tamu - Dinas Kesehatan</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Haluskan rendering font pada perangkat mobile */
    body {
      -webkit-tap-highlight-color: transparent;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

  <!-- WRAPPER MOBILE CONTAINER (Dioptimasi pas untuk layar HP) -->
  <div class="w-full max-w-md mx-auto">
    
    <!-- 1. BANNER ATAS / GAMBAR GEDUNG KANTOR DINKES -->
    <div class="relative w-full h-48 bg-slate-800 overflow-hidden">
      <!-- GANTI src DI BAWAH DENGAN FILE GAMBAR TEMPAT/GEDUNG DINKES ANDA -->
      <img 
        src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9QNj3SW6wszcn6juq8JomAaEJ3-x-gO9qbI3GyIjmiSDYY8x-ohtzZX9WhN8hPDW11aeZ7CSkzEWUViZO8n5A9-Oeo4lBHbWl_H4XGkRnxqrN1x-xS_613y4LQvsLOqhVKjnmOy=s1360-w1360-h1020-rw" 
        alt="Gedung Kantor Dinas Kesehatan" 
        class="w-full h-full object-cover opacity-85"
      >
      <!-- Gradasi Halus agar menyatu ke bawah -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
    </div>

    <!-- 2. LOGO INSTANSI & HEADER INFORMASI -->
    <div class="px-5 relative -mt-14 text-center flex flex-col items-center">
      <!-- LOGO DINKES (Bentuk Squircle: Sudut Melingkar Halus) -->
      <div class="w-24 h-24 bg-white p-1.5 rounded-3xl shadow-xl ring-4 ring-white/80 overflow-hidden flex items-center justify-center">
        <!-- GANTI src DI BAWAH DENGAN FILE LOGO DINKES ANDA -->
        <img 
          src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Lambang_Kabupaten_Cirebon.gif?utm_source=id.wikipedia.org&utm_campaign=index&utm_content=original" 
          alt="Logo Dinas Kesehatan" 
          class="w-full h-full object-contain rounded-2xl"
          onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl\'>+</div>';"
        >
      </div>

      <!-- Teks Judul & Deskripsi Singkat -->
      <div class="mt-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-0.5 bg-emerald-50 text-emerald-800 border border-emerald-200/60 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Layanan Akses Mandiri
        </span>
        <h1 class="text-xl font-black text-slate-900 tracking-tight mt-1.5">DINAS KESEHATAN</h1>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed max-w-xs mx-auto">
          Silakan akses buku tamu digital, dokumen kearsipan SOTK, regulasi.
        </p>
      </div>
    </div>

    <!-- 3. DAFTAR KARTU LINK (DIMUAT DINAMIS DARI FIRESTORE) -->
    <main class="px-5 mt-6 flex-1">
      <div id="link-list" class="space-y-3">
        <!-- Placeholder loading status saat dibuka -->
        <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200 text-center">
          <div class="animate-spin inline-block w-6 h-6 border-2 border-emerald-600 border-t-transparent rounded-full mb-2"></div>
          <p class="text-xs text-slate-500 font-medium">Memuat tautan layanan...</p>
        </div>
      </div>
    </main>

    <!-- 4. FOOTER RESMI -->
    <footer class="mt-8 px-5 text-center text-slate-400">
      <div class="w-12 h-0.5 bg-slate-200 mx-auto mb-3 rounded-full"></div>
      <p class="text-[11px] font-semibold text-slate-500">© 2026 Dinas Kesehatan</p>
      <p class="text-[10px] text-slate-400 mt-0.5">Sistem Portal Tamu & Kearsipan Berbasis QR Code</p>
    </footer>

  </div>

  <!-- FIREBASE INTEGRATION VIA CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAf4oRUliv3bcDkD2t4REgojJ48dIz_1ts",
      authDomain: "test-dinkes.firebaseapp.com",
      projectId: "test-dinkes",
      storageBucket: "test-dinkes.firebasestorage.app",
      messagingSenderId: "340667856156",
      appId: "1:340667856156:web:e7edcbf1e4e85d2a0876d9",
      measurementId: "G-0GG7NLYBN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function muatTautan() {
      const container = document.getElementById("link-list");

      try {
        const q = query(collection(db, "links"), orderBy("urutan", "asc"));
        const snapshot = await getDocs(q);

        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="p-8 bg-slate-50 rounded-2xl border border-dashed border-slate-300 text-center text-slate-400">
              <p class="text-xs font-semibold">Belum ada tautan yang aktif.</p>
              <p class="text-[10px] mt-1 text-slate-400">Tambahkan melalui dashboard admin.</p>
            </div>
          `;
          return;
        }

        snapshot.forEach((docSnapshot) => {
          const item = docSnapshot.data();

          const card = document.createElement("a");
          card.href = item.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.className = "group flex items-center justify-between p-3.5 bg-white border border-slate-200/90 rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-500 hover:bg-emerald-50/20 active:scale-[0.98] transition-all duration-150";

          // Logika Tampilan Ikon/Gambar: Jika admin mengisi URL gambar -> tampilkan gambar kecil, jika tidak -> pakai ikon dokumen bawaan
          let visualElementHtml = "";
          if (item.icon && item.icon.trim() !== "") {
            visualElementHtml = `
              <div class="w-11 h-11 rounded-xl bg-slate-100 overflow-hidden shrink-0 border border-slate-200/60 p-1 flex items-center justify-center">
                <img src="${item.icon}" alt="Icon ${item.judul}" class="w-full h-full object-contain rounded-lg" onerror="this.parentElement.innerHTML='<span class=\'text-slate-400 font-bold text-xs\'>🔗</span>'">
              </div>
            `;
          } else {
            visualElementHtml = `
              <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flex items-center space-x-3.5 pr-2 truncate">
              ${visualElementHtml}
              <div class="truncate text-left">
                <span class="inline-block text-[10px] font-extrabold text-emerald-700 uppercase tracking-wider">
                  ${item.kategori || 'Layanan'}
                </span>
                <h2 class="text-xs font-bold text-slate-800 truncate group-hover:text-emerald-950 transition-colors">
                  ${item.judul}
                </h2>
              </div>
            </div>
            <!-- Panah Arah Kanan -->
            <div class="text-slate-300 group-hover:text-emerald-600 group-hover:translate-x-0.5 transition-all shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Firebase Read Error:", err);
        container.innerHTML = `
          <div class="p-5 bg-rose-50 border border-rose-200 rounded-2xl text-center text-rose-700">
            <p class="text-xs font-bold">Gagal memuat layanan</p>
            <p class="text-[10px] mt-0.5 text-rose-500">${err.message}</p>
          </div>
        `;
      }
    }

    muatTautan();
  </script>
</body>
</html>
