<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Kunjungan Tamu - Dinas Kesehatan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library PapaParse untuk parsing data Google Sheet (CSV) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold uppercase mb-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Data Kunjungan Live
        </div>
        <h1 class="text-xl md:text-2xl font-black text-slate-900">Buku Tamu & Aspirasi Masuk</h1>
        <p class="text-xs text-slate-500 mt-0.5">Data terhubung langsung dari respon Google Form</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="ambilDataGoogleSheet()" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Muat Ulang
        </button>
        <a href="admin.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition">
          Ke Admin
        </a>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="w-full md:w-80">
        <input type="text" id="input-cari" onkeyup="filterTabel()" placeholder="Cari nama, instansi, atau tujuan..." class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>
      <div id="info-total" class="text-xs text-slate-500 font-medium">
        Memuat data...
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead id="tabel-head" class="bg-slate-50 border-b border-slate-200 text-slate-700 font-bold uppercase tracking-wider">
            <!-- Header kolom otomatis menyesuaikan pertanyaan di Google Form -->
          </thead>
          <tbody id="tabel-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">
                Sedang mengunduh tanggapan dari Google Sheets...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // GANTI LINK DI BAWAH INI DENGAN LINK CSV HASIL "PUBLISH TO WEB" SPREADSHEET ANDA
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwbNwfOvTvPQUk_QmmQerrnmg4Zwe4WpdZ9iRfNawFfqUHLSnWMWErGbyTsm8Vx2F26bhvOO2hyc6Y/pub?output=csv";

    let semuaData = [];
    let headerKolom = [];

    function ambilDataGoogleSheet() {
      if (CSV_URL.includes("PASTE_LINK_CSV")) {
        document.getElementById("tabel-body").innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-amber-700 bg-amber-50">
              <b>Link CSV belum diisi!</b><br>
              Silakan ganti nilai variabel <code>CSV_URL</code> di dalam script dengan link publikasi CSV Spreadsheet Anda.
            </td>
          </tr>
        `;
        document.getElementById("info-total").innerText = "Konfigurasi belum selesai";
        return;
      }

      document.getElementById("info-total").innerText = "Menyinkronkan data...";

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            headerKolom = results.meta.fields;
            semuaData = results.data.reverse(); // Menampilkan data tamu paling baru di urutan teratas
            renderTabel(semuaData);
            document.getElementById("info-total").innerText = `Total Kunjungan: ${semuaData.length} data`;
          } else {
            document.getElementById("tabel-body").innerHTML = `
              <tr>
                <td colspan="6" class="p-8 text-center text-slate-400">Belum ada respon masuk di Google Form.</td>
              </tr>
            `;
            document.getElementById("info-total").innerText = "0 data";
          }
        },
        error: function(err) {
          console.error(err);
          document.getElementById("tabel-body").innerHTML = `
            <tr>
              <td colspan="6" class="p-8 text-center text-rose-600 bg-rose-50">
                Gagal memuat data. Pastikan opsi 'Publikasikan ke web' berformat .csv sudah aktif.
              </td>
            </tr>
          `;
        }
      });
    }

    function renderTabel(data) {
      const thead = document.getElementById("tabel-head");
      const tbody = document.getElementById("tabel-body");

      // Buat Header Dinamis
      thead.innerHTML = "";
      const trHead = document.createElement("tr");
      trHead.innerHTML = `<th class="p-3.5 pl-5 w-12 text-slate-400">No</th>`;
      headerKolom.forEach(col => {
        trHead.innerHTML += `<th class="p-3.5 whitespace-nowrap">${col}</th>`;
      });
      thead.appendChild(trHead);

      // Buat Baris Data
      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${headerKolom.length + 1}" class="p-6 text-center text-slate-400">Tidak ada data yang cocok dengan pencarian.</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50/80 transition-colors";
        
        let barisHtml = `<td class="p-3.5 pl-5 font-bold text-slate-400">${index + 1}</td>`;
        headerKolom.forEach(col => {
          const val = row[col] || "-";
          barisHtml += `<td class="p-3.5 text-slate-700 whitespace-nowrap">${val}</td>`;
        });
        tr.innerHTML = barisHtml;
        tbody.appendChild(tr);
      });
    }

    // Fungsi Pencarian Cepat
    function filterTabel() {
      const keyword = document.getElementById("input-cari").value.toLowerCase();
      const hasilFilter = semuaData.filter(row => {
        return Object.values(row).some(nilai => 
          String(nilai).toLowerCase().includes(keyword)
        );
      });
      renderTabel(hasilFilter);
      document.getElementById("info-total").innerText = `Menampilkan: ${hasilFilter.length} dari ${semuaData.length} data`;
    }

    // Ambil data saat halaman dibuka
    ambilDataGoogleSheet();
  </script>
</body>
</html>
