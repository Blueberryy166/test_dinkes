<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pengaturan Link DPMD / Dinkes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-2xl mx-auto">
    <!-- Login PIN Sederhana -->
    <div id="auth-box" class="bg-white p-6 rounded-xl shadow-md max-w-sm mx-auto mt-20 text-center">
      <h2 class="text-lg font-bold mb-4">Masuk Hak Akses Admin</h2>
      <input type="password" id="admin-pin" placeholder="Masukkan PIN (Default: 123456)" class="border p-2 w-full rounded mb-3 text-center">
      <button type="button" id="btn-login" class="bg-blue-600 text-white px-4 py-2 rounded w-full font-semibold hover:bg-blue-700">Buka Pengaturan</button>
    </div>

    <!-- Dashboard Konten -->
    <div id="admin-content" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
        <h1 class="text-xl font-bold text-gray-800">Kelola Tautan & Kearsipan</h1>
        <a href="index.html" target="_blank" class="text-blue-600 text-sm hover:underline">Lihat Tampilan Publik →</a>
      </div>

      <!-- Form Tambah Link -->
      <form id="form-tambah" class="bg-white p-6 rounded-xl shadow-sm space-y-4">
        <h2 class="font-bold text-gray-700">Tambah / Perbarui Tautan</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Judul Layanan</label>
            <input type="text" id="judul" placeholder="Contoh: Form Buku Tamu" required class="border p-2 w-full rounded">
          </div>
          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Kategori</label>
            <input type="text" id="kategori" placeholder="Contoh: Layanan / Kearsipan / Regulasi" class="border p-2 w-full rounded">
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-500 font-bold block mb-1">URL / Link Target</label>
          <input type="url" id="url" placeholder="https://forms.google.com/..." required class="border p-2 w-full rounded">
        </div>
        <div>
          <label class="text-xs text-gray-500 font-bold block mb-1">Nomor Urutan</label>
          <input type="number" id="urutan" value="1" class="border p-2 w-32 rounded">
        </div>
        <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded font-semibold hover:bg-emerald-700">Simpan Tautan</button>
      </form>

      <!-- Tabel Daftar Link -->
      <div class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="font-bold text-gray-700 mb-4">Daftar Link Aktif</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="border-b bg-gray-50 text-gray-700">
              <tr>
                <th class="p-3">Urutan</th>
                <th class="p-3">Judul & Kategori</th>
                <th class="p-3">URL</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-link">
              <tr><td colspan="4" class="p-3 text-center text-gray-400">Menunggu inisialisasi database...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Script 1: Verifikasi PIN (Reguler) -->
  <script>
    document.getElementById("btn-login").addEventListener("click", function() {
      const pin = document.getElementById("admin-pin").value;
      if (pin === "123456") {
        document.getElementById("auth-box").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        
        if (typeof window.tampilkanData === "function") {
          window.tampilkanData();
        }
      } else {
        alert("PIN salah! Masukkan 123456");
      }
    });

    document.getElementById("admin-pin").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        document.getElementById("btn-login").click();
      }
    });
  </script>

  <!-- Script 2: Firebase Firestore (Sudah disesuaikan dengan konfigurasi Anda) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAf4oRUliv3bcDkD2t4REgojJ48dIz_1ts",
      authDomain: "test-dinkes.firebaseapp.com",
      projectId: "test-dinkes",
      storageBucket: "test-dinkes.firebasestorage.app",
      messagingSenderId: "340667856156",
      appId: "1:340667856156:web:e7edcbf1e4e85d2a0876d9",
      measurementId: "G-0GG7NLYBN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.tampilkanData = async function() {
      const tabel = document.getElementById("tabel-link");
      tabel.innerHTML = "<tr><td colspan='4' class='p-3 text-center'>Menghubungkan ke database...</td></tr>";

      try {
        const q = query(collection(db, "links"), orderBy("urutan", "asc"));
        const snapshot = await getDocs(q);

        tabel.innerHTML = "";
        if (snapshot.empty) {
          tabel.innerHTML = "<tr><td colspan='4' class='p-3 text-center text-gray-400'>Belum ada tautan. Silakan masukkan link di formulir atas.</td></tr>";
          return;
        }

        snapshot.forEach((dokumen) => {
          const item = dokumen.data();
          const tr = document.createElement("tr");
          tr.className = "border-b hover:bg-gray-50";
          tr.innerHTML = `
            <td class="p-3 font-semibold">${item.urutan || 0}</td>
            <td class="p-3">
              <div class="font-bold text-gray-800">${item.judul}</div>
              <span class="text-xs bg-gray-200 px-2 py-0.5 rounded">${item.kategori || '-'}</span>
            </td>
            <td class="p-3 truncate max-w-xs text-blue-500">${item.url}</td>
            <td class="p-3 text-center">
              <button onclick="window.hapusLink('${dokumen.id}')" class="text-red-600 hover:text-red-800 font-semibold">Hapus</button>
            </td>
          `;
          tabel.appendChild(tr);
        });
      } catch (e) {
        tabel.innerHTML = `<tr><td colspan='4' class='p-3 text-center text-red-500 font-medium'>Gagal: ${e.message}<br><small class='text-gray-500'>Pastikan tab "Firestore Database" sudah dibuat dan Rules diatur ke true.</small></td></tr>`;
        console.error(e);
      }
    };

    document.getElementById("form-tambah").addEventListener("submit", async (e) => {
      e.preventDefault();
      const judul = document.getElementById("judul").value;
      const kategori = document.getElementById("kategori").value;
      const url = document.getElementById("url").value;
      const urutan = parseInt(document.getElementById("urutan").value, 10) || 1;

      try {
        await addDoc(collection(db, "links"), { judul, kategori, url, urutan });
        document.getElementById("form-tambah").reset();
        window.tampilkanData();
      } catch (err) {
        alert("Gagal menyimpan data: " + err.message);
        console.error(err);
      }
    });

    window.hapusLink = async function(id) {
      if (confirm("Hapus tautan ini?")) {
        try {
          await deleteDoc(doc(db, "links", id));
          window.tampilkanData();
        } catch (err) {
          alert("Gagal menghapus: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
