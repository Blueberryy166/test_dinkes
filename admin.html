<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Dinas Kesehatan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-2xl mx-auto">

    <!-- Form Login Admin Resmi -->
    <div id="auth-box" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 max-w-sm mx-auto mt-16">
      <h2 class="text-xl font-bold text-gray-800 text-center mb-1">Masuk Admin</h2>
      <p class="text-xs text-gray-500 text-center mb-6">Gunakan akun admin terdaftar</p>
      
      <form id="form-login" class="space-y-4">
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">Email</label>
          <input type="email" id="login-email" placeholder="admin@dinkes.go.id" required class="w-full border p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">Kata Sandi</label>
          <input type="password" id="login-password" placeholder="••••••••" required class="w-full border p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <p id="login-error" class="text-xs text-red-600 hidden"></p>
        <button type="submit" id="btn-submit-login" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 transition">Masuk</button>
      </form>
    </div>

    <!-- Dashboard Konten (Hanya terbuka jika akun terverifikasi) -->
    <div id="admin-content" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div>
          <h1 class="text-lg font-bold text-gray-800">Kelola Tautan & Kearsipan</h1>
          <p id="user-display" class="text-xs text-gray-500"></p>
        </div>
        <div class="space-x-2">
          <a href="index.html" target="_blank" class="text-xs text-blue-600 hover:underline">Lihat Publik →</a>
          <button id="btn-logout" class="text-xs bg-red-100 text-red-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-red-200">Keluar</button>
        </div>
      </div>

      <!-- Form Tambah Link -->
      <form id="form-tambah" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
        <h2 class="font-bold text-gray-700 text-sm uppercase tracking-wide">Tambah Tautan Layanan</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Judul Layanan</label>
            <input type="text" id="judul" placeholder="Contoh: Form Buku Tamu" required class="border p-2 w-full rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Kategori</label>
            <input type="text" id="kategori" placeholder="Contoh: Layanan / Kearsipan / Regulasi" class="border p-2 w-full rounded text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-500 font-bold block mb-1">URL / Link Target (Google Form / Drive / Web)</label>
          <input type="url" id="url" placeholder="https://..." required class="border p-2 w-full rounded text-sm">
        </div>
        <div>
          <label class="text-xs text-gray-500 font-bold block mb-1">Nomor Urutan Tampil</label>
          <input type="number" id="urutan" value="1" class="border p-2 w-32 rounded text-sm">
        </div>
        <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-semibold text-sm hover:bg-emerald-700">Simpan Tautan</button>
      </form>

      <!-- Tabel Daftar Link -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-gray-700 mb-4 text-sm uppercase tracking-wide">Daftar Link Aktif</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="border-b bg-gray-50 text-gray-700">
              <tr>
                <th class="p-3">Urut</th>
                <th class="p-3">Judul & Kategori</th>
                <th class="p-3">URL</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-link">
              <tr><td colspan="4" class="p-3 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAf4oRUliv3bcDkD2t4REgojJ48dIz_1ts",
      authDomain: "test-dinkes.firebaseapp.com",
      projectId: "test-dinkes",
      storageBucket: "test-dinkes.firebasestorage.app",
      messagingSenderId: "340667856156",
      appId: "1:340667856156:web:e7edcbf1e4e85d2a0876d9",
      measurementId: "G-0GG7NLYBN9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Pantau status login pengguna
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-box").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        document.getElementById("user-display").innerText = `Login sebagai: ${user.email}`;
        muatData();
      } else {
        document.getElementById("auth-box").classList.remove("hidden");
        document.getElementById("admin-content").classList.add("hidden");
      }
    });

    // Proses Login
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;
      const errBox = document.getElementById("login-error");

      errBox.classList.add("hidden");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errBox.innerText = "Email atau kata sandi salah.";
        errBox.classList.remove("hidden");
      }
    });

    // Proses Logout
    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth);
    });

    // Ambil Data Link
    async function muatData() {
      const tabel = document.getElementById("tabel-link");
      tabel.innerHTML = "<tr><td colspan='4' class='p-3 text-center'>Memuat data...</td></tr>";

      try {
        const q = query(collection(db, "links"), orderBy("urutan", "asc"));
        const snapshot = await getDocs(q);

        tabel.innerHTML = "";
        if (snapshot.empty) {
          tabel.innerHTML = "<tr><td colspan='4' class='p-3 text-center text-gray-400'>Belum ada tautan yang disimpan.</td></tr>";
          return;
        }

        snapshot.forEach((dokumen) => {
          const item = dokumen.data();
          const tr = document.createElement("tr");
          tr.className = "border-b hover:bg-gray-50";
          tr.innerHTML = `
            <td class="p-3 font-semibold">${item.urutan || 0}</td>
            <td class="p-3">
              <div class="font-bold text-gray-800">${item.judul}</div>
              <span class="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-700">${item.kategori || '-'}</span>
            </td>
            <td class="p-3 truncate max-w-xs text-blue-500">${item.url}</td>
            <td class="p-3 text-center">
              <button onclick="window.hapusLink('${dokumen.id}')" class="text-red-600 hover:text-red-800 font-semibold text-xs">Hapus</button>
            </td>
          `;
          tabel.appendChild(tr);
        });
      } catch (e) {
        tabel.innerHTML = `<tr><td colspan='4' class='p-3 text-center text-red-500'>Akses ditolak: ${e.message}</td></tr>`;
      }
    }

    // Tambah Data
    document.getElementById("form-tambah").addEventListener("submit", async (e) => {
      e.preventDefault();
      const judul = document.getElementById("judul").value;
      const kategori = document.getElementById("kategori").value;
      const url = document.getElementById("url").value;
      const urutan = parseInt(document.getElementById("urutan").value, 10) || 1;

      try {
        await addDoc(collection(db, "links"), { judul, kategori, url, urutan });
        document.getElementById("form-tambah").reset();
        muatData();
      } catch (err) {
        alert("Gagal menyimpan data: Pastikan akun Anda memiliki izin.");
      }
    });

    // Hapus Data
    window.hapusLink = async function(id) {
      if (confirm("Hapus tautan ini?")) {
        try {
          await deleteDoc(doc(db, "links", id));
          muatData();
        } catch (err) {
          alert("Gagal menghapus tautan.");
        }
      }
    };
  </script>
</body>
</html>
